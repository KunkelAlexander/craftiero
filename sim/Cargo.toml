[package]
name = "sim"
version = "0.1.0"
edition = "2021"

[dependencies]
# The terrain. The sim edits it (digging) and samples it (collision).
sdf = { path = "../sdf" }
# Same version the viewer uses, so `sim::Vec3` IS the viewer's `Vec3`.
# The `serde` feature lets vectors travel over the wire later (M4+).
glam = { version = "0.27", features = ["scalar-math", "serde"] }
# Only the derive macros: they let the sim's data types be turned into bytes by
# the `protocol` crate. The sim itself never serializes anything and still does
# no I/O.
serde = { version = "1", features = ["derive"] }
