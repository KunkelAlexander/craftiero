[package]
name = "viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
sdf = { path = "../sdf" }
sim = { path = "../sim" }
protocol = { path = "../protocol" }
host = { path = "../host" }
glam = { version = "0.27", features = ["scalar-math"] }
# Window and GPU. Native first; wgpu also targets WebGPU for the later web build.
winit = "0.30"
wgpu = "30"
# Plain-old-data casts so uniform structs can be handed to the GPU as bytes.
bytemuck = { version = "1", features = ["derive"] }
# `std::time::Instant` panics in a browser tab; this is the same type on native
# and a `performance.now()` clock on the web.
web-time = "1"
# Native audio output. All sounds are synthesised in `audio.rs`; there are no
# files. `cpal` gives us the device and the callback, nothing else. On the web
# it talks to WebAudio (the `wasm-bindgen` feature), still no files.
cpal = "0.18"
# Screenshot output for the headless `--shot` mode.
png = "0.18"

# Blocks on wgpu's async setup calls. A browser cannot block, so the web build
# awaits them instead (see `create_viewer` in main.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1"
# Native WebSocket for online play (the web build uses the browser's own, see
# socket.rs). The rustls feature lets a desktop client reach a `wss://` relay:
# Render only serves https/wss.
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# The end-to-end tests in local.rs run a real relay in-process.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
server = { path = "../server" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.18", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console", "Window", "Document", "Element", "HtmlCanvasElement",
    # The relay connection (socket.rs).
    "WebSocket", "BinaryType", "MessageEvent",
] }
