[package]
name = "protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
sim = { path = "../sim" }
sdf = { path = "../sdf" }
serde = { version = "1", features = ["derive"] }
# bincode turns a Rust value into compact bytes and back. Version 1 is the
# simple "serialize / deserialize" one.
bincode = "1.3"

[dev-dependencies]
# Only the tests build small grids by hand.
glam = "0.27"
