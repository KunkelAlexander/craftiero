<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1280px; height: 720px; overflow: hidden; background: #000; }
  svg { display: block; }
  text { font-family: "Bahnschrift", "Segoe UI", sans-serif; }
  .label { font-size: 9.5px; letter-spacing: 3px; font-weight: 600; }
  .tiny { font-size: 8px; letter-spacing: 1.4px; font-weight: 500; }
  .name { font-size: 29px; letter-spacing: 1.6px; font-weight: 700; }
  .num { font-size: 36px; font-weight: 700; letter-spacing: 0.5px; }
  .value { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
</style>
</head>
<body>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur3" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur6" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur9" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102d3b" stop-opacity=".94"/>
      <stop offset=".42" stop-color="#081c27" stop-opacity=".92"/>
      <stop offset="1" stop-color="#041019" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="panelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8f2ff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#a8f2ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="healthGrad" x1="106" y1="0" x2="282" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffdc66"/>
      <stop offset=".38" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#ff6a1a"/>
    </linearGradient>
    <linearGradient id="currentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffdf82"/>
      <stop offset="1" stop-color="#ff8a1c"/>
    </linearGradient>
    <linearGradient id="chargeGrad" x1="138" y1="0" x2="250" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b7fbff"/>
      <stop offset="1" stop-color="#39bfff"/>
    </linearGradient>
    <radialGradient id="badgeGrad" cx=".38" cy=".30" r=".85">
      <stop offset="0" stop-color="#12384a"/>
      <stop offset=".65" stop-color="#071a24"/>
      <stop offset="1" stop-color="#030b10"/>
    </radialGradient>
    <radialGradient id="novaGrad" cx=".5" cy=".45" r=".55">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".38" stop-color="#d8fdff"/>
      <stop offset=".7" stop-color="#66dcff"/>
      <stop offset="1" stop-color="#1d8cd6" stop-opacity=".2"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#bdf6ff" opacity=".045"/>
    </pattern>

    <linearGradient id="topShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#001018" stop-opacity=".58"/>
      <stop offset=".24" stop-color="#001018" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".72">
      <stop offset=".52" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="coolWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a7e9e" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#0a7e9e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="warmWash" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff8b2b" stop-opacity=".10"/>
      <stop offset=".55" stop-color="#ff8b2b" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="leftClip">
      <path d="M28 2 H356 L378 20 V78 L358 98 H28 L2 78 V20 Z"/>
    </clipPath>
    <clipPath id="rightClip">
      <path d="M352 2 H24 L2 20 V78 L22 98 H352 L378 78 V20 Z"/>
    </clipPath>
    <clipPath id="hpFill"><rect x="106" y="38" width="137.3" height="18"/></clipPath>
    <clipPath id="hpTrail"><rect x="106" y="38" width="151.4" height="18"/></clipPath>
  </defs>

  <!-- Background: the actual game frame, lightly graded so the HUD is judged against it. -->
  <image href="../screenshots/worm_in_game.png" x="0" y="0" width="1280" height="720"
         preserveAspectRatio="xMidYMid slice" style="filter:saturate(1.10) contrast(1.04) brightness(.97)"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#coolWash)"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#warmWash)"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#topShade)"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#vignette)"/>

  <!-- ============================ TOP LEFT: VITALS ============================ -->
  <g transform="translate(20 22)">
    <path d="M28 2 H356 L378 20 V78 L358 98 H28 L2 78 V20 Z" fill="#000" opacity=".55" filter="url(#blur9)" transform="translate(0 5)"/>
    <path d="M28 2 H356 L378 20 V78 L358 98 H28 L2 78 V20 Z" fill="none" stroke="#52e4ff" stroke-width="5" opacity=".22" filter="url(#blur6)"/>
    <path d="M28 2 H356 L378 20 V78 L358 98 H28 L2 78 V20 Z" fill="url(#panelFill)" stroke="#66e9ff" stroke-opacity=".62" stroke-width="1.5"/>
    <g clip-path="url(#leftClip)">
      <rect x="0" y="0" width="380" height="100" fill="url(#panelTop)"/>
      <rect x="0" y="0" width="380" height="100" fill="url(#scan)"/>
      <path d="M28 98 H128 L120 88 H28 Z" fill="#ffb02e" opacity=".20"/>
      <path d="M30 6 H353" stroke="#d9fbff" stroke-opacity=".22" stroke-width="1"/>
      <path d="M6 24 V76" stroke="#d9fbff" stroke-opacity=".10" stroke-width="1"/>
    </g>
    <!-- corner rivets -->
    <g fill="#a9eef8" opacity=".30">
      <circle cx="42" cy="13" r="1.5"/><circle cx="338" cy="13" r="1.5"/>
      <circle cx="42" cy="87" r="1.5"/><circle cx="338" cy="87" r="1.5"/>
    </g>

    <!-- badge -->
    <circle cx="56" cy="50" r="35" fill="#000" opacity=".45" filter="url(#blur6)"/>
    <circle cx="56" cy="50" r="36" fill="none" stroke="#51e6ff" stroke-width="3" opacity=".34" filter="url(#blur3)"/>
    <circle cx="56" cy="50" r="33" fill="url(#badgeGrad)" stroke="#79eeff" stroke-width="1.6"/>
    <circle cx="56" cy="50" r="27" fill="none" stroke="#2b7387" stroke-width="1"/>
    <g stroke="#a9f7ff" stroke-width="1.5" opacity=".72">
      <line x1="56" y1="14" x2="56" y2="18"/><line x1="56" y1="82" x2="56" y2="86"/>
      <line x1="20" y1="50" x2="24" y2="50"/><line x1="88" y1="50" x2="92" y2="50"/>
      <line x1="30.5" y1="24.5" x2="33.5" y2="27.5"/><line x1="78.5" y1="72.5" x2="81.5" y2="75.5"/>
      <line x1="81.5" y1="24.5" x2="78.5" y2="27.5"/><line x1="33.5" y1="72.5" x2="30.5" y2="75.5"/>
    </g>
    <!-- grumpy worm mark -->
    <path d="M47 74 C37 69 38 55 49 53 C57 51 61 57 58 63 C56 68 49 68 48 63"
          fill="none" stroke="#2b120c" stroke-width="9" stroke-linecap="round"/>
    <path d="M47 74 C37 69 38 55 49 53 C57 51 61 57 58 63 C56 68 49 68 48 63"
          fill="none" stroke="#ff8a3c" stroke-width="5.6" stroke-linecap="round"/>
    <circle cx="59" cy="42" r="11" fill="#ff8a3c" stroke="#2b120c" stroke-width="2"/>
    <path d="M52 36 L57 38 M66 36 L61 38" stroke="#2b120c" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="55.5" cy="41" r="2" fill="#1b0d09"/><circle cx="62.5" cy="41" r="2" fill="#1b0d09"/>
    <circle cx="56.1" cy="40.3" r=".65" fill="#fff6e2"/><circle cx="63.1" cy="40.3" r=".65" fill="#fff6e2"/>
    <path d="M54 46 Q59 50 64 46" fill="none" stroke="#2b120c" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M57 48.6 L58 46.8 M61 48.6 L60 46.8" stroke="#ffe8cf" stroke-width="1.1" stroke-linecap="round"/>

    <!-- divider + labels -->
    <line x1="97" y1="22" x2="97" y2="78" stroke="#6feaff" stroke-opacity=".22"/>
    <text x="106" y="25" class="label" fill="#92ecff" opacity=".9">VITALS</text>

    <!-- health bar shell -->
    <rect x="106" y="38" width="176" height="18" rx="3" fill="#020b10" stroke="#2b6a7a" stroke-opacity=".85"/>
    <!-- damage trail -->
    <g clip-path="url(#hpTrail)">
      <g fill="#fff1d6" opacity=".24">
        <rect x="106" y="40" width="15.8" height="14"/><rect x="123.8" y="40" width="15.8" height="14"/>
        <rect x="141.6" y="40" width="15.8" height="14"/><rect x="159.4" y="40" width="15.8" height="14"/>
        <rect x="177.2" y="40" width="15.8" height="14"/><rect x="195" y="40" width="15.8" height="14"/>
        <rect x="212.8" y="40" width="15.8" height="14"/><rect x="230.6" y="40" width="15.8" height="14"/>
        <rect x="248.4" y="40" width="15.8" height="14"/><rect x="266.2" y="40" width="15.8" height="14"/>
      </g>
    </g>
    <!-- health fill -->
    <g clip-path="url(#hpFill)">
      <g fill="url(#healthGrad)">
        <rect x="106" y="40" width="15.8" height="14"/><rect x="123.8" y="40" width="15.8" height="14"/>
        <rect x="141.6" y="40" width="15.8" height="14"/><rect x="159.4" y="40" width="15.8" height="14"/>
        <rect x="177.2" y="40" width="15.8" height="14"/><rect x="195" y="40" width="15.8" height="14"/>
        <rect x="212.8" y="40" width="15.8" height="14"/><rect x="230.6" y="40" width="15.8" height="14"/>
        <rect x="248.4" y="40" width="15.8" height="14"/><rect x="266.2" y="40" width="15.8" height="14"/>
      </g>
      <g fill="#fff9e8" opacity=".30">
        <rect x="106" y="40" width="15.8" height="3.5"/><rect x="123.8" y="40" width="15.8" height="3.5"/>
        <rect x="141.6" y="40" width="15.8" height="3.5"/><rect x="159.4" y="40" width="15.8" height="3.5"/>
        <rect x="177.2" y="40" width="15.8" height="3.5"/><rect x="195" y="40" width="15.8" height="3.5"/>
        <rect x="212.8" y="40" width="15.8" height="3.5"/><rect x="230.6" y="40" width="15.8" height="3.5"/>
      </g>
    </g>
    <!-- segment cuts + bar rim -->
    <g fill="#04121a">
      <rect x="121.8" y="38" width="2" height="18"/><rect x="139.6" y="38" width="2" height="18"/>
      <rect x="157.4" y="38" width="2" height="18"/><rect x="175.2" y="38" width="2" height="18"/>
      <rect x="193" y="38" width="2" height="18"/><rect x="210.8" y="38" width="2" height="18"/>
      <rect x="228.6" y="38" width="2" height="18"/><rect x="246.4" y="38" width="2" height="18"/>
      <rect x="264.2" y="38" width="2" height="18"/>
    </g>
    <rect x="106" y="38" width="176" height="18" rx="3" fill="none" stroke="#8ff4ff" stroke-opacity=".30"/>

    <line x1="298" y1="29" x2="298" y2="69" stroke="#2a6b7d" stroke-opacity=".55"/>
    <text x="356" y="66" text-anchor="end" class="num" fill="#fff7e7" filter="url(#softGlow)">78</text>
    <text x="356" y="82" text-anchor="end" class="tiny" fill="#87b3be">MAX 100</text>

    <text x="106" y="87" class="tiny" fill="#7fa9b4">KILLS <tspan fill="#ffcc6b">04</tspan>   DEATHS <tspan fill="#ff8d6b">02</tspan></text>
  </g>

  <!-- ============================ TOP RIGHT: ARMAMENT ============================ -->
  <g transform="translate(880 22)">
    <path d="M352 2 H24 L2 20 V78 L22 98 H352 L378 78 V20 Z" fill="#000" opacity=".55" filter="url(#blur9)" transform="translate(0 5)"/>
    <path d="M352 2 H24 L2 20 V78 L22 98 H352 L378 78 V20 Z" fill="none" stroke="#52e4ff" stroke-width="5" opacity=".22" filter="url(#blur6)"/>
    <path d="M352 2 H24 L2 20 V78 L22 98 H352 L378 78 V20 Z" fill="url(#panelFill)" stroke="#66e9ff" stroke-opacity=".62" stroke-width="1.5"/>
    <g clip-path="url(#rightClip)">
      <rect x="0" y="0" width="380" height="100" fill="url(#panelTop)"/>
      <rect x="0" y="0" width="380" height="100" fill="url(#scan)"/>
      <path d="M352 98 H252 L260 88 H352 Z" fill="#5fe8ff" opacity=".12"/>
      <path d="M27 6 H350" stroke="#d9fbff" stroke-opacity=".22" stroke-width="1"/>
      <path d="M374 24 V76" stroke="#d9fbff" stroke-opacity=".10" stroke-width="1"/>
    </g>
    <g fill="#a9eef8" opacity=".30">
      <circle cx="42" cy="13" r="1.5"/><circle cx="338" cy="13" r="1.5"/>
      <circle cx="42" cy="87" r="1.5"/><circle cx="338" cy="87" r="1.5"/>
    </g>

    <!-- badge with charge ring -->
    <circle cx="324" cy="50" r="35" fill="#000" opacity=".45" filter="url(#blur6)"/>
    <circle cx="324" cy="50" r="36" fill="none" stroke="#51e6ff" stroke-width="3" opacity=".34" filter="url(#blur3)"/>
    <circle cx="324" cy="50" r="33" fill="url(#badgeGrad)" stroke="#79eeff" stroke-width="1.6"/>
    <circle cx="324" cy="50" r="27" fill="none" stroke="#2b7387" stroke-width="1"/>
    <circle cx="324" cy="50" r="37" fill="none" stroke="#0a2631" stroke-width="3.5"/>
    <circle cx="324" cy="50" r="37" fill="none" stroke="#9ff8ff" stroke-width="3.5"
            stroke-linecap="round" stroke-dasharray="167.3 232.5" transform="rotate(-90 324 50)"
            filter="url(#glow)"/>
    <g stroke="#a9f7ff" stroke-width="1.5" opacity=".72">
      <line x1="324" y1="14" x2="324" y2="18"/><line x1="324" y1="82" x2="324" y2="86"/>
      <line x1="288" y1="50" x2="292" y2="50"/><line x1="356" y1="50" x2="360" y2="50"/>
    </g>
    <!-- nova mark -->
    <circle cx="324" cy="50" r="18" fill="url(#novaGrad)" opacity=".8" filter="url(#blur3)"/>
    <path d="M324 28 L329 45 L346 50 L329 55 L324 72 L319 55 L302 50 L319 45 Z" fill="#ffffff" filter="url(#glow)"/>
    <path d="M324 36 L327 47 L338 50 L327 53 L324 64 L321 53 L310 50 L321 47 Z"
          fill="#c8f9ff" opacity=".58" transform="rotate(45 324 50)"/>
    <circle cx="324" cy="50" r="3.6" fill="#ffffff"/>

    <!-- weapon text -->
    <text x="22" y="25" class="label" fill="#92ecff" opacity=".9">ARMAMENT <tspan fill="#417582">/</tspan> SLOT <tspan fill="#ffcf6b">09</tspan></text>
    <text x="22" y="56" class="name" fill="#f5fbff" filter="url(#softGlow)">NOVA</text>
    <text x="22" y="83" class="value" fill="#fff2da">1 <tspan fill="#5c8792" font-size="13">/ 1</tspan></text>
    <text x="92" y="80" class="tiny" fill="#7fb4c0">CHARGE</text>
    <rect x="138" y="71" width="112" height="8" fill="#020b10" stroke="#2b6a7a" stroke-opacity=".7"/>
    <rect x="140" y="73" width="79" height="4" fill="url(#chargeGrad)" filter="url(#softGlow)"/>
    <rect x="140" y="73" width="79" height="1.5" fill="#effeff" opacity=".55"/>
    <text x="254" y="80" class="tiny" fill="#aeeff6">72%</text>
    <line x1="22" y1="65" x2="272" y2="65" stroke="#6feaff" stroke-opacity=".12"/>
  </g>

  <!-- ============================ QUICK-SLOT STRIP ============================ -->
  <g transform="translate(880 132)">
    <path d="M10 0 H370 L380 10 V18 L370 28 H10 L0 18 V10 Z" fill="#04121a" opacity=".82" stroke="#2d6a79" stroke-opacity=".7"/>
    <path d="M11 1 H369" stroke="#b8f7ff" stroke-opacity=".15"/>
    <g font-family="Bahnschrift, Segoe UI, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">
      <!-- slots: 1 2 3 4 5 6 7 8 9 0 - = -->
      <g fill="#6f9ba6">
        <rect x="12" y="6" width="27" height="16" rx="2.5" fill="#071b24" stroke="#1b4a58"/>
        <text x="25.5" y="18" fill="#6f9ba6">1</text>
        <rect x="42" y="6" width="27" height="16" rx="2.5" fill="#071b24" stroke="#1b4a58"/>
        <text x="55.5" y="18" fill="#6f9ba6">2</text>
        <rect x="72" y="6" width="27" height="16" rx="2.5" fill="#071b24" stroke="#1b4a58"/>
        <text x="85.5" y="18" fill="#6f9ba6">3</text>
        <rect x="102" y="6" width="27" height="16" rx="2.5" fill="#071b24" stroke="#1b4a58"/>
        <text x="115.5" y="18" fill="#6f9ba6">4</text>
        <rect x="132" y="6" width="27" height="16" rx="2.5" fill="#071b24" stroke="#1b4a58"/>
        <text x="145.5" y="18" fill="#6f9ba6">5</text>
        <rect x="162" y="6" width="27" height="16" rx="2.5" fill="#071b24" stroke="#1b4a58"/>
        <text x="175.5" y="18" fill="#6f9ba6">6</text>
        <rect x="192" y="6" width="27" height="16" rx="2.5" fill="#071b24" stroke="#1b4a58"/>
        <text x="205.5" y="18" fill="#6f9ba6">7</text>
        <rect x="222" y="6" width="27" height="16" rx="2.5" fill="#071b24" stroke="#1b4a58"/>
        <text x="235.5" y="18" fill="#6f9ba6">8</text>
        <rect x="252" y="6" width="27" height="16" rx="2.5" fill="url(#currentGrad)" stroke="#ffe2a0"/>
        <text x="265.5" y="18" fill="#231303" font-weight="700">9</text>
        <rect x="282" y="6" width="27" height="16" rx="2.5" fill="#071b24" stroke="#1b4a58"/>
        <text x="295.5" y="18" fill="#6f9ba6">0</text>
        <rect x="312" y="6" width="27" height="16" rx="2.5" fill="#071b24" stroke="#1b4a58"/>
        <text x="325.5" y="18" fill="#6f9ba6">-</text>
        <rect x="342" y="6" width="27" height="16" rx="2.5" fill="#071b24" stroke="#1b4a58"/>
        <text x="355.5" y="18" fill="#6f9ba6">=</text>
      </g>
    </g>
    <rect x="252" y="6" width="27" height="16" rx="2.5" fill="none" stroke="#ffd27a" opacity=".9"/>
    <rect x="252" y="21" width="27" height="1.5" fill="#ffcf6b" opacity=".7" filter="url(#softGlow)"/>
  </g>

  <!-- ============================ RETICLE ============================ -->
  <g transform="translate(640 360)">
    <g stroke="#001018" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".65">
      <path d="M-5 -22 L0 -17 L5 -22" fill="none"/>
      <path d="M-5 22 L0 17 L5 22" fill="none"/>
      <path d="M-22 -5 L-17 0 L-22 5" fill="none"/>
      <path d="M22 -5 L17 0 L22 5" fill="none"/>
    </g>
    <g stroke="#9ff6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
      <path d="M-5 -22 L0 -17 L5 -22" fill="none"/>
      <path d="M-5 22 L0 17 L5 22" fill="none"/>
      <path d="M-22 -5 L-17 0 L-22 5" fill="none"/>
      <path d="M22 -5 L17 0 L22 5" fill="none"/>
    </g>
    <circle r="13" fill="none" stroke="#dffbff" stroke-opacity=".30" stroke-width="1"/>
    <circle r="4.2" fill="none" stroke="#ffcf6b" stroke-opacity=".85" stroke-width="1.2"/>
    <circle r="1.7" fill="#ffcf6b" filter="url(#softGlow)"/>
  </g>
</svg>
</body>
</html>
