<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1280px; height: 720px; overflow: hidden; background: #000; }
  svg { display: block; }
  text { font-family: "Bahnschrift", "Segoe UI", sans-serif; }
  .num { font-size: 35px; font-weight: 700; letter-spacing: 0.5px; }
  .ammo { font-size: 27px; font-weight: 700; letter-spacing: 1px; }
  .tiny { font-size: 9px; letter-spacing: 1px; font-weight: 600; }
</style>
</head>
<body>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur3" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur6" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur9" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2a1b" stop-opacity=".95"/>
      <stop offset=".42" stop-color="#191a10" stop-opacity=".94"/>
      <stop offset="1" stop-color="#0c0d08" stop-opacity=".97"/>
    </linearGradient>
    <linearGradient id="panelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d99c" stop-opacity=".19"/>
      <stop offset="1" stop-color="#f3d99c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="healthGrad" x1="106" y1="0" x2="282" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8dd75"/>
      <stop offset=".38" stop-color="#e7aa3e"/>
      <stop offset="1" stop-color="#c76a2a"/>
    </linearGradient>
    <linearGradient id="chargeGrad" x1="22" y1="0" x2="230" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a9c2e2"/>
      <stop offset="1" stop-color="#5c7ca6"/>
    </linearGradient>
    <linearGradient id="weaponGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8df91"/>
      <stop offset=".55" stop-color="#e5b354"/>
      <stop offset="1" stop-color="#bf7a2e"/>
    </linearGradient>
    <radialGradient id="badgeGrad" cx=".36" cy=".30" r=".86">
      <stop offset="0" stop-color="#3b3c27"/>
      <stop offset=".62" stop-color="#1b1c12"/>
      <stop offset="1" stop-color="#0a0b06"/>
    </radialGradient>
    <radialGradient id="novaGrad" cx=".5" cy=".45" r=".58">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".42" stop-color="#ffe8b6"/>
      <stop offset=".75" stop-color="#e8b45a"/>
      <stop offset="1" stop-color="#b7762d" stop-opacity=".12"/>
    </radialGradient>
    <pattern id="aged" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 6.5 H7" stroke="#f6dca2" stroke-opacity=".035"/>
      <circle cx="2" cy="2" r=".55" fill="#f6dca2" opacity=".055"/>
      <circle cx="5.5" cy="4.5" r=".45" fill="#000" opacity=".10"/>
    </pattern>

    <linearGradient id="topShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090a05" stop-opacity=".60"/>
      <stop offset=".24" stop-color="#090a05" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".72">
      <stop offset=".52" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#050503" stop-opacity=".58"/>
    </radialGradient>
    <linearGradient id="oliveWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#768145" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#768145" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="warmWash" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff9b3d" stop-opacity=".11"/>
      <stop offset=".55" stop-color="#ff9b3d" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="leftClip">
      <path d="M28 2 H356 L378 20 V78 L358 98 H28 L2 78 V20 Z"/>
    </clipPath>
    <clipPath id="rightClip">
      <path d="M352 2 H24 L2 20 V78 L22 98 H352 L378 78 V20 Z"/>
    </clipPath>
    <clipPath id="hpFill"><rect x="106" y="44" width="137.3" height="20"/></clipPath>
    <clipPath id="hpTrail"><rect x="106" y="44" width="151.4" height="20"/></clipPath>
  </defs>

  <!-- Background: the actual game frame, graded warmer and earthier. -->
  <image href="../screenshots/worm_in_game.png" x="0" y="0" width="1280" height="720"
         preserveAspectRatio="xMidYMid slice" style="filter:saturate(1.08) contrast(1.04) brightness(.95)"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#oliveWash)"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#warmWash)"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#topShade)"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#vignette)"/>

  <!-- ============================ TOP LEFT: VITALS ============================ -->
  <g transform="translate(20 22)">
    <path d="M28 2 H356 L378 20 V78 L358 98 H28 L2 78 V20 Z" fill="#000" opacity=".62" filter="url(#blur9)" transform="translate(0 5)"/>
    <path d="M28 2 H356 L378 20 V78 L358 98 H28 L2 78 V20 Z" fill="none" stroke="#d7a85b" stroke-width="5" opacity=".22" filter="url(#blur6)"/>
    <path d="M28 2 H356 L378 20 V78 L358 98 H28 L2 78 V20 Z" fill="url(#panelFill)" stroke="#c99a55" stroke-opacity=".90" stroke-width="1.6"/>
    <g clip-path="url(#leftClip)">
      <rect x="0" y="0" width="380" height="100" fill="url(#panelTop)"/>
      <rect x="0" y="0" width="380" height="100" fill="url(#aged)"/>
      <path d="M28 98 H134 L124 88 H28 Z" fill="#c98d3c" opacity=".22"/>
      <path d="M8 50 Q54 24 80 50 Q54 76 8 50 Z" fill="#76906a" opacity=".08"/>

      <path d="M6 25 V75" stroke="#ffe9b7" stroke-opacity=".10" stroke-width="1"/>
    </g>
    <!-- brass rivets -->
    <g>
      <circle cx="42" cy="13" r="2.2" fill="#4c3418" stroke="#d9ae66" stroke-width=".8"/>
      <circle cx="338" cy="13" r="2.2" fill="#4c3418" stroke="#d9ae66" stroke-width=".8"/>
      <circle cx="42" cy="87" r="2.2" fill="#4c3418" stroke="#d9ae66" stroke-width=".8"/>
      <circle cx="338" cy="87" r="2.2" fill="#4c3418" stroke="#d9ae66" stroke-width=".8"/>
    </g>

    <!-- badge -->
    <circle cx="56" cy="50" r="35" fill="#000" opacity=".50" filter="url(#blur6)"/>
    <circle cx="56" cy="50" r="36" fill="none" stroke="#d7a55a" stroke-width="3" opacity=".35" filter="url(#blur3)"/>
    <circle cx="56" cy="50" r="33" fill="url(#badgeGrad)" stroke="#d9b06e" stroke-width="1.8"/>
    <circle cx="56" cy="50" r="27" fill="none" stroke="#5c4728" stroke-width="1"/>
    <g stroke="#e5c487" stroke-width="1.4" opacity=".72">
      <line x1="56" y1="14" x2="56" y2="18"/><line x1="56" y1="82" x2="56" y2="86"/>
      <line x1="20" y1="50" x2="24" y2="50"/><line x1="88" y1="50" x2="92" y2="50"/>
      <line x1="30.5" y1="24.5" x2="33.5" y2="27.5"/><line x1="78.5" y1="72.5" x2="81.5" y2="75.5"/>
      <line x1="81.5" y1="24.5" x2="78.5" y2="27.5"/><line x1="33.5" y1="72.5" x2="30.5" y2="75.5"/>
    </g>
    <!-- grumpy worm mark -->
    <path d="M47 74 C37 69 38 55 49 53 C57 51 61 57 58 63 C56 68 49 68 48 63"
          fill="none" stroke="#2b120c" stroke-width="9" stroke-linecap="round"/>
    <path d="M47 74 C37 69 38 55 49 53 C57 51 61 57 58 63 C56 68 49 68 48 63"
          fill="none" stroke="#ff8a3c" stroke-width="5.6" stroke-linecap="round"/>
    <circle cx="59" cy="42" r="11" fill="#ff8a3c" stroke="#2b120c" stroke-width="2"/>
    <path d="M52 36 L57 38 M66 36 L61 38" stroke="#2b120c" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="55.5" cy="41" r="2" fill="#1b0d09"/><circle cx="62.5" cy="41" r="2" fill="#1b0d09"/>
    <circle cx="56.1" cy="40.3" r=".65" fill="#fff6e2"/><circle cx="63.1" cy="40.3" r=".65" fill="#fff6e2"/>
    <path d="M54 46 Q59 50 64 46" fill="none" stroke="#2b120c" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M57 48.6 L58 46.8 M61 48.6 L60 46.8" stroke="#ffe8cf" stroke-width="1.1" stroke-linecap="round"/>

    <!-- health bar shell -->
    <rect x="106" y="44" width="176" height="20" rx="3" fill="#080905" stroke="#7b582b" stroke-opacity=".95"/>
    <rect x="108" y="46" width="172" height="16" rx="2" fill="#020302" opacity=".9"/>
    <!-- damage trail -->
    <g clip-path="url(#hpTrail)">
      <g fill="#fff0cf" opacity=".22">
        <rect x="106" y="46" width="15.8" height="16"/><rect x="123.8" y="46" width="15.8" height="16"/>
        <rect x="141.6" y="46" width="15.8" height="16"/><rect x="159.4" y="46" width="15.8" height="16"/>
        <rect x="177.2" y="46" width="15.8" height="16"/><rect x="195" y="46" width="15.8" height="16"/>
        <rect x="212.8" y="46" width="15.8" height="16"/><rect x="230.6" y="46" width="15.8" height="16"/>
        <rect x="248.4" y="46" width="15.8" height="16"/><rect x="266.2" y="46" width="15.8" height="16"/>
      </g>
    </g>
    <!-- health fill -->
    <g clip-path="url(#hpFill)">
      <g fill="url(#healthGrad)">
        <rect x="106" y="46" width="15.8" height="16"/><rect x="123.8" y="46" width="15.8" height="16"/>
        <rect x="141.6" y="46" width="15.8" height="16"/><rect x="159.4" y="46" width="15.8" height="16"/>
        <rect x="177.2" y="46" width="15.8" height="16"/><rect x="195" y="46" width="15.8" height="16"/>
        <rect x="212.8" y="46" width="15.8" height="16"/><rect x="230.6" y="46" width="15.8" height="16"/>
        <rect x="248.4" y="46" width="15.8" height="16"/><rect x="266.2" y="46" width="15.8" height="16"/>
      </g>
      <g fill="#fff8e6" opacity=".30">
        <rect x="106" y="46" width="15.8" height="4"/><rect x="123.8" y="46" width="15.8" height="4"/>
        <rect x="141.6" y="46" width="15.8" height="4"/><rect x="159.4" y="46" width="15.8" height="4"/>
        <rect x="177.2" y="46" width="15.8" height="4"/><rect x="195" y="46" width="15.8" height="4"/>
        <rect x="212.8" y="46" width="15.8" height="4"/><rect x="230.6" y="46" width="15.8" height="4"/>
      </g>
    </g>
    <!-- segment cuts + bar rim -->
    <g fill="#0b0c07">
      <rect x="121.8" y="44" width="2" height="20"/><rect x="139.6" y="44" width="2" height="20"/>
      <rect x="157.4" y="44" width="2" height="20"/><rect x="175.2" y="44" width="2" height="20"/>
      <rect x="193" y="44" width="2" height="20"/><rect x="210.8" y="44" width="2" height="20"/>
      <rect x="228.6" y="44" width="2" height="20"/><rect x="246.4" y="44" width="2" height="20"/>
      <rect x="264.2" y="44" width="2" height="20"/>
    </g>
    <rect x="106" y="44" width="176" height="20" rx="3" fill="none" stroke="#e6c07e" stroke-opacity=".32"/>

    <line x1="298" y1="24" x2="298" y2="78" stroke="#7b582b" stroke-opacity=".8"/>
    <text x="356" y="68" text-anchor="end" class="num" fill="#f8ecd0" filter="url(#softGlow)">78</text>

    <!-- kills / deaths: icons, not words -->
    <g transform="translate(107 87)" opacity=".9">
      <circle r="4.6" fill="none" stroke="#d9b06e" stroke-width="1.1"/>
      <path d="M-7.2 0 H-4 M4 0 H7.2 M0 -7.2 V-4 M0 4 V7.2" stroke="#d9b06e" stroke-width="1.1" stroke-linecap="round"/>
      <circle r="1.2" fill="#d9b06e"/>
    </g>
    <text x="119" y="90" class="tiny" fill="#d9b06e">04</text>
    <g transform="translate(147 87)" opacity=".9">
      <path d="M0 -5 C3.4 -5 5.6 -2.7 5.6 .2 C5.6 2.2 4.6 3.4 3.4 4.1 L3.4 5.6 L1.9 5.6 L1.9 4.6 L0.8 4.6 L0.8 5.6 L-0.8 5.6 L-0.8 4.6 L-1.9 4.6 L-1.9 5.6 L-3.4 5.6 L-3.4 4.1 C-4.6 3.4 -5.6 2.2 -5.6 .2 C-5.6 -2.7 -3.4 -5 0 -5 Z"
            fill="none" stroke="#c98d6a" stroke-width="1.1"/>
      <circle cx="-2" cy="0" r="1.1" fill="#c98d6a"/><circle cx="2" cy="0" r="1.1" fill="#c98d6a"/>
      <path d="M-1 2.6 H1" stroke="#c98d6a" stroke-width=".9"/>
    </g>
    <text x="157" y="90" class="tiny" fill="#c98d6a">02</text>
  </g>

  <!-- ============================ TOP RIGHT: WEAPON ============================ -->
  <g transform="translate(880 22)">
    <path d="M352 2 H24 L2 20 V78 L22 98 H352 L378 78 V20 Z" fill="#000" opacity=".62" filter="url(#blur9)" transform="translate(0 5)"/>
    <path d="M352 2 H24 L2 20 V78 L22 98 H352 L378 78 V20 Z" fill="none" stroke="#d7a85b" stroke-width="5" opacity=".22" filter="url(#blur6)"/>
    <path d="M352 2 H24 L2 20 V78 L22 98 H352 L378 78 V20 Z" fill="url(#panelFill)" stroke="#c99a55" stroke-opacity=".90" stroke-width="1.6"/>
    <g clip-path="url(#rightClip)">
      <rect x="0" y="0" width="380" height="100" fill="url(#panelTop)"/>

      <path d="M352 98 H246 L256 88 H352 Z" fill="#6f8d69" opacity=".13"/>
      <path d="M27 6 H350" stroke="#ffe9b7" stroke-opacity=".28" stroke-width="1"/>
      <path d="M374 25 V75" stroke="#ffe9b7" stroke-opacity=".10" stroke-width="1"/>
    </g>
    <g>
      <circle cx="42" cy="13" r="2.2" fill="#4c3418" stroke="#d9ae66" stroke-width=".8"/>
      <circle cx="338" cy="13" r="2.2" fill="#4c3418" stroke="#d9ae66" stroke-width=".8"/>
      <circle cx="42" cy="87" r="2.2" fill="#4c3418" stroke="#d9ae66" stroke-width=".8"/>
      <circle cx="338" cy="87" r="2.2" fill="#4c3418" stroke="#d9ae66" stroke-width=".8"/>
    </g>

    <!-- badge with charge ring -->
    <circle cx="324" cy="50" r="35" fill="#000" opacity=".50" filter="url(#blur6)"/>
    <circle cx="324" cy="50" r="36" fill="none" stroke="#d7a55a" stroke-width="3" opacity=".35" filter="url(#blur3)"/>
    <circle cx="324" cy="50" r="33" fill="url(#badgeGrad)" stroke="#d9b06e" stroke-width="1.8"/>
    <circle cx="324" cy="50" r="27" fill="none" stroke="#5c4728" stroke-width="1"/>
    <circle cx="324" cy="50" r="37" fill="none" stroke="#332815" stroke-width="3.5"/>
    <circle cx="324" cy="50" r="37" fill="none" stroke="#9ab5d6" stroke-width="3.5"
            stroke-linecap="round" stroke-dasharray="167.3 232.5" transform="rotate(-90 324 50)"
            filter="url(#glow)"/>
    <g stroke="#e5c487" stroke-width="1.4" opacity=".72">
      <line x1="324" y1="14" x2="324" y2="18"/><line x1="324" y1="82" x2="324" y2="86"/>
      <line x1="288" y1="50" x2="292" y2="50"/><line x1="356" y1="50" x2="360" y2="50"/>
    </g>

    <path d="M324 28 L329 45 L346 50 L329 55 L324 72 L319 55 L302 50 L319 45 Z" fill="#fff7e4" filter="url(#glow)"/>
    <path d="M324 36 L327 47 L338 50 L327 53 L324 64 L321 53 L310 50 L321 47 Z"

    <text x="22" y="58" class="ammo" fill="#f8ecd0" filter="url(#softGlow)">1 <tspan fill="#b8a47c" font-size="19">/ 1</tspan></text>
    <rect x="22" y="72" width="208" height="10" fill="#080905" stroke="#7b582b" stroke-opacity=".95"/>
    <rect x="24" y="74" width="148" height="6" fill="url(#chargeGrad)" filter="url(#softGlow)"/>
    <rect x="24" y="74" width="148" height="2" fill="#eef6ff" opacity=".45"/>
    <rect x="171" y="72" width="2" height="10" fill="#f4e0b4" opacity=".9"/>
    <path d="M22 88 H230" stroke="#7b582b" stroke-opacity=".55"/>
  </g>

  <!-- ============================ WEAPON BELT ============================ -->

    <!-- 05 bomb -->

    </g>

    <g transform="translate(174.5 31.9) scale(1.15)">
      <path d="M0 -12 L10.39 -6 L10.39 6 L0 12 L-10.39 6 L-10.39 -6 Z" fill="#15170e" stroke="#9b6e39" stroke-width="1.3"/>

      <circle cx="-5.4" cy="-4.2" r="1.7" fill="#e6d2a0"/>
      <circle cx="5.2" cy="-3.4" r="1.7" fill="#e6d2a0"/>
      <circle cx="4.4" cy="5.2" r="1.7" fill="#e6d2a0"/>
