<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1280px; height: 720px; overflow: hidden; background: #000; }
  svg { display: block; }
  text { font-family: "Bahnschrift", "Segoe UI", sans-serif; }
  .num { font-size: 36px; font-weight: 700; letter-spacing: .5px; }
  .ammo { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
  .pct { font-size: 12px; font-weight: 700; letter-spacing: .5px; }
  .tiny { font-size: 10px; letter-spacing: .8px; font-weight: 600; }
</style>
</head>
<body>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur3" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur6" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f2f1d" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#1a1b10" stop-opacity=".94"/>
      <stop offset="1" stop-color="#0c0d08" stop-opacity=".97"/>
    </linearGradient>
    <linearGradient id="panelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d99c" stop-opacity=".18"/>
      <stop offset="1" stop-color="#f3d99c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="healthGrad" x1="98" y1="0" x2="242" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8dd75"/>
      <stop offset=".38" stop-color="#e7aa3e"/>
      <stop offset="1" stop-color="#c76a2a"/>
    </linearGradient>
    <linearGradient id="ammoGrad" x1="34" y1="0" x2="154" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8e29b"/>
      <stop offset=".55" stop-color="#e2ad4a"/>
      <stop offset="1" stop-color="#bc762b"/>
    </linearGradient>
    <linearGradient id="chargeGrad" x1="34" y1="0" x2="154" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b4ccea"/>
      <stop offset="1" stop-color="#53749f"/>
    </linearGradient>
    <radialGradient id="badgeGrad" cx=".36" cy=".30" r=".86">
      <stop offset="0" stop-color="#3b3c27"/>
      <stop offset=".62" stop-color="#1b1c12"/>
      <stop offset="1" stop-color="#0a0b06"/>
    </radialGradient>
    <radialGradient id="novaGrad" cx=".5" cy=".45" r=".58">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".42" stop-color="#ffe8b6"/>
      <stop offset=".75" stop-color="#e8b45a"/>
      <stop offset="1" stop-color="#b7762d" stop-opacity=".12"/>
    </radialGradient>
    <pattern id="aged" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 6.5 H7" stroke="#f6dca2" stroke-opacity=".035"/>
      <circle cx="2" cy="2" r=".55" fill="#f6dca2" opacity=".055"/>
      <circle cx="5.5" cy="4.5" r=".45" fill="#000" opacity=".10"/>
    </pattern>

    <linearGradient id="topShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090a05" stop-opacity=".46"/>
      <stop offset=".22" stop-color="#090a05" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".72">
      <stop offset=".52" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#050503" stop-opacity=".56"/>
    </radialGradient>
    <linearGradient id="oliveWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#768145" stop-opacity=".17"/>
      <stop offset=".55" stop-color="#768145" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="warmWash" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff9b3d" stop-opacity=".10"/>
      <stop offset=".55" stop-color="#ff9b3d" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="healthClip4">
      <path d="M28 2 H302 L328 28 V64 L302 90 H28 L2 64 V28 Z"/>
    </clipPath>
    <clipPath id="weaponClip4">
      <path d="M32 2 H140 L170 32 V158 L140 188 H32 L2 158 V32 Z"/>
    </clipPath>
    <clipPath id="hpFill4"><rect x="98" y="34" width="112.32" height="24"/></clipPath>
    <clipPath id="hpTrail4"><rect x="98" y="34" width="123.84" height="24"/></clipPath>
    <clipPath id="chargeFill4"><rect x="34" y="160" width="86.4" height="10"/></clipPath>
  </defs>

  <!-- Background: the actual game frame, graded warmer and earthier. -->
  <image href="../screenshots/worm_in_game.png" x="0" y="0" width="1280" height="720"
         preserveAspectRatio="xMidYMid slice" style="filter:saturate(1.08) contrast(1.04) brightness(.95)"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#oliveWash)"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#warmWash)"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#topShade)"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#vignette)"/>

  <!-- ======================= TOP LEFT: VITALS ======================= -->
  <g transform="translate(28 24)">
    <path d="M28 2 H302 L328 28 V64 L302 90 H28 L2 64 V28 Z" fill="#000" opacity=".62" filter="url(#blur6)" transform="translate(0 5)"/>
    <path d="M28 2 H302 L328 28 V64 L302 90 H28 L2 64 V28 Z" fill="none" stroke="#d7a85b" stroke-width="5" opacity=".20" filter="url(#blur3)"/>
    <path d="M28 2 H302 L328 28 V64 L302 90 H28 L2 64 V28 Z" fill="url(#panelFill)" stroke="#c99a55" stroke-opacity=".92" stroke-width="1.6"/>
    <g clip-path="url(#healthClip4)">
      <rect x="0" y="0" width="330" height="92" fill="url(#panelTop)"/>
      <rect x="0" y="0" width="330" height="92" fill="url(#aged)"/>
      <path d="M28 90 H96 L88 80 H28 Z" fill="#c98d3c" opacity=".20"/>
      <path d="M31 5 H299" stroke="#ffe9b7" stroke-opacity=".28" stroke-width="1"/>
    </g>
    <g>
      <circle cx="22" cy="14" r="2" fill="#4c3418" stroke="#d9ae66" stroke-width=".8"/>
      <circle cx="308" cy="14" r="2" fill="#4c3418" stroke="#d9ae66" stroke-width=".8"/>
      <circle cx="22" cy="76" r="2" fill="#4c3418" stroke="#d9ae66" stroke-width=".8"/>
      <circle cx="308" cy="76" r="2" fill="#4c3418" stroke="#d9ae66" stroke-width=".8"/>
    </g>

    <!-- badge -->
    <g transform="translate(-10 -4)">
      <circle cx="56" cy="50" r="35" fill="#000" opacity=".45" filter="url(#blur3)"/>
      <circle cx="56" cy="50" r="36" fill="none" stroke="#d7a55a" stroke-width="3" opacity=".32" filter="url(#blur3)"/>
      <circle cx="56" cy="50" r="33" fill="url(#badgeGrad)" stroke="#d9b06e" stroke-width="1.8"/>
      <circle cx="56" cy="50" r="27" fill="none" stroke="#5c4728" stroke-width="1"/>
      <g stroke="#e5c487" stroke-width="1.4" opacity=".72">
        <line x1="56" y1="14" x2="56" y2="18"/><line x1="56" y1="82" x2="56" y2="86"/>
        <line x1="20" y1="50" x2="24" y2="50"/><line x1="88" y1="50" x2="92" y2="50"/>
        <line x1="30.5" y1="24.5" x2="33.5" y2="27.5"/><line x1="78.5" y1="72.5" x2="81.5" y2="75.5"/>
        <line x1="81.5" y1="24.5" x2="78.5" y2="27.5"/><line x1="33.5" y1="72.5" x2="30.5" y2="75.5"/>
      </g>
      <path d="M47 74 C37 69 38 55 49 53 C57 51 61 57 58 63 C56 68 49 68 48 63"
            fill="none" stroke="#2b120c" stroke-width="9" stroke-linecap="round"/>
      <path d="M47 74 C37 69 38 55 49 53 C57 51 61 57 58 63 C56 68 49 68 48 63"
            fill="none" stroke="#ff8a3c" stroke-width="5.6" stroke-linecap="round"/>
      <circle cx="59" cy="42" r="11" fill="#ff8a3c" stroke="#2b120c" stroke-width="2"/>
      <path d="M52 36 L57 38 M66 36 L61 38" stroke="#2b120c" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="55.5" cy="41" r="2" fill="#1b0d09"/><circle cx="62.5" cy="41" r="2" fill="#1b0d09"/>
      <circle cx="56.1" cy="40.3" r=".65" fill="#fff6e2"/><circle cx="63.1" cy="40.3" r=".65" fill="#fff6e2"/>
      <path d="M54 46 Q59 50 64 46" fill="none" stroke="#2b120c" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M57 48.6 L58 46.8 M61 48.6 L60 46.8" stroke="#ffe8cf" stroke-width="1.1" stroke-linecap="round"/>
    </g>

    <!-- health bar -->
    <rect x="98" y="34" width="144" height="24" rx="4" fill="#080905" stroke="#7b582b" stroke-opacity=".95"/>
    <rect x="100" y="36" width="140" height="20" rx="3" fill="#020302" opacity=".9"/>
    <g clip-path="url(#hpTrail4)">
      <g fill="#fff0cf" opacity=".22">
        <rect x="98" y="36" width="16.25" height="20"/><rect x="116.25" y="36" width="16.25" height="20"/>
        <rect x="134.5" y="36" width="16.25" height="20"/><rect x="152.75" y="36" width="16.25" height="20"/>
        <rect x="171" y="36" width="16.25" height="20"/><rect x="189.25" y="36" width="16.25" height="20"/>
        <rect x="207.5" y="36" width="16.25" height="20"/><rect x="225.75" y="36" width="16.25" height="20"/>
      </g>
    </g>
    <g clip-path="url(#hpFill4)">
      <g fill="url(#healthGrad)">
        <rect x="98" y="36" width="16.25" height="20"/><rect x="116.25" y="36" width="16.25" height="20"/>
        <rect x="134.5" y="36" width="16.25" height="20"/><rect x="152.75" y="36" width="16.25" height="20"/>
        <rect x="171" y="36" width="16.25" height="20"/><rect x="189.25" y="36" width="16.25" height="20"/>
        <rect x="207.5" y="36" width="16.25" height="20"/><rect x="225.75" y="36" width="16.25" height="20"/>
      </g>
      <g fill="#fff8e6" opacity=".30">
        <rect x="98" y="36" width="16.25" height="5"/><rect x="116.25" y="36" width="16.25" height="5"/>
        <rect x="134.5" y="36" width="16.25" height="5"/><rect x="152.75" y="36" width="16.25" height="5"/>
        <rect x="171" y="36" width="16.25" height="5"/><rect x="189.25" y="36" width="16.25" height="5"/>
      </g>
    </g>
    <g fill="#0b0c07">
      <rect x="114.25" y="34" width="2" height="24"/><rect x="132.5" y="34" width="2" height="24"/>
      <rect x="150.75" y="34" width="2" height="24"/><rect x="169" y="34" width="2" height="24"/>
      <rect x="187.25" y="34" width="2" height="24"/><rect x="205.5" y="34" width="2" height="24"/>
      <rect x="223.75" y="34" width="2" height="24"/>
    </g>
    <rect x="98" y="34" width="144" height="24" rx="4" fill="none" stroke="#e6c07e" stroke-opacity=".32"/>

    <line x1="260" y1="24" x2="260" y2="72" stroke="#7b582b" stroke-opacity=".8"/>
    <text x="312" y="64" text-anchor="end" class="num" fill="#f8ecd0" filter="url(#softGlow)">78</text>

    <!-- kills / deaths, icon-only -->
    <g transform="translate(100 79)" opacity=".9">
      <circle r="4.2" fill="none" stroke="#d9b06e" stroke-width="1"/>
      <path d="M-6.2 0 H-3.4 M3.4 0 H6.2 M0 -6.2 V-3.4 M0 3.4 V6.2" stroke="#d9b06e" stroke-width="1" stroke-linecap="round"/>
      <circle r="1" fill="#d9b06e"/>
    </g>
    <text x="110" y="82" class="tiny" fill="#d9b06e">04</text>
    <g transform="translate(136 79) scale(.72)" opacity=".9">
      <path d="M0 -5 C3.4 -5 5.6 -2.7 5.6 .2 C5.6 2.2 4.6 3.4 3.4 4.1 L3.4 5.6 L1.9 5.6 L1.9 4.6 L0.8 4.6 L0.8 5.6 L-0.8 5.6 L-0.8 4.6 L-1.9 4.6 L-1.9 5.6 L-3.4 5.6 L-3.4 4.1 C-4.6 3.4 -5.6 2.2 -5.6 .2 C-5.6 -2.7 -3.4 -5 0 -5 Z"
            fill="none" stroke="#c98d6a" stroke-width="1.1"/>
      <circle cx="-2" cy="0" r="1.1" fill="#c98d6a"/><circle cx="2" cy="0" r="1.1" fill="#c98d6a"/>
      <path d="M-1 2.6 H1" stroke="#c98d6a" stroke-width=".9"/>
    </g>
    <text x="146" y="82" class="tiny" fill="#c98d6a">02</text>
  </g>

  <!-- ======================= TOP RIGHT: WEAPON ======================= -->
  <g transform="translate(1080 24)">
    <path d="M32 2 H140 L170 32 V158 L140 188 H32 L2 158 V32 Z" fill="#000" opacity=".62" filter="url(#blur6)" transform="translate(0 5)"/>
    <path d="M32 2 H140 L170 32 V158 L140 188 H32 L2 158 V32 Z" fill="none" stroke="#d7a85b" stroke-width="5" opacity=".20" filter="url(#blur3)"/>
    <path d="M32 2 H140 L170 32 V158 L140 188 H32 L2 158 V32 Z" fill="url(#panelFill)" stroke="#c99a55" stroke-opacity=".92" stroke-width="1.6"/>
    <g clip-path="url(#weaponClip4)">
      <rect x="0" y="0" width="172" height="190" fill="url(#panelTop)"/>
      <rect x="0" y="0" width="172" height="190" fill="url(#aged)"/>
      <path d="M2 48 Q32 26 66 48 Q32 70 2 48 Z" fill="#76906a" opacity=".07"/>
      <path d="M33 5 H139" stroke="#ffe9b7" stroke-opacity=".28" stroke-width="1"/>
    </g>
    <g>
      <circle cx="22" cy="14" r="2" fill="#4c3418" stroke="#d9ae66" stroke-width=".8"/>
      <circle cx="150" cy="14" r="2" fill="#4c3418" stroke="#d9ae66" stroke-width=".8"/>
      <circle cx="22" cy="176" r="2" fill="#4c3418" stroke="#d9ae66" stroke-width=".8"/>
      <circle cx="150" cy="176" r="2" fill="#4c3418" stroke="#d9ae66" stroke-width=".8"/>
    </g>

    <!-- current weapon emblem + charge arc -->
    <circle cx="86" cy="52" r="38" fill="#000" opacity=".45" filter="url(#blur3)"/>
    <circle cx="86" cy="52" r="39" fill="none" stroke="#d7a55a" stroke-width="3" opacity=".32" filter="url(#blur3)"/>
    <circle cx="86" cy="52" r="36" fill="url(#badgeGrad)" stroke="#d9b06e" stroke-width="1.8"/>
    <circle cx="86" cy="52" r="29" fill="none" stroke="#5c4728" stroke-width="1"/>
    <circle cx="86" cy="52" r="41" fill="none" stroke="#332815" stroke-width="3.6"/>
    <circle cx="86" cy="52" r="41" fill="none" stroke="#9ab5d6" stroke-width="3.6"
            stroke-linecap="round" stroke-dasharray="185.5 257.6" transform="rotate(-90 86 52)"
            filter="url(#glow)"/>
    <g stroke="#e5c487" stroke-width="1.4" opacity=".72">
      <line x1="86" y1="12" x2="86" y2="17"/><line x1="86" y1="87" x2="86" y2="92"/>
      <line x1="46" y1="52" x2="51" y2="52"/><line x1="121" y1="52" x2="126" y2="52"/>
    </g>
    <!-- nova mark -->
    <circle cx="86" cy="52" r="19" fill="url(#novaGrad)" opacity=".85" filter="url(#blur3)"/>
    <path d="M86 33 L91 46 L105 52 L91 58 L86 71 L81 58 L67 52 L81 46 Z" fill="#fff7e4" filter="url(#glow)"/>
    <path d="M86 40 L90 48 L98 52 L90 56 L86 64 L82 56 L74 52 L82 48 Z"
          fill="#ffe0a3" opacity=".55" transform="rotate(45 86 52)"/>
    <circle cx="86" cy="52" r="3.5" fill="#ffffff"/>

    <!-- AMMO row: bullet icon + count + gold bar -->
    <g transform="translate(22 113)">
      <path d="M-3.6 6 V-1.8 C-3.6 -4.6 -2 -6.2 0 -6.2 C2 -6.2 3.6 -4.6 3.6 -1.8 V6 Z"
            fill="#e5c487"/>
      <path d="M-3.6 3.2 H3.6" stroke="#2a1a0c" stroke-width=".9" opacity=".55"/>
    </g>
    <text x="154" y="118" text-anchor="end" class="ammo" fill="#f7de8f">1 <tspan fill="#b8a47c" font-size="10">/ 1</tspan></text>
    <rect x="34" y="122" width="120" height="10" fill="#080905" stroke="#7b582b" stroke-opacity=".95"/>
    <g fill="url(#ammoGrad)">
      <rect x="34" y="123" width="10.65" height="8"/><rect x="46.15" y="123" width="10.65" height="8"/>
      <rect x="58.3" y="123" width="10.65" height="8"/><rect x="70.45" y="123" width="10.65" height="8"/>
      <rect x="82.6" y="123" width="10.65" height="8"/><rect x="94.75" y="123" width="10.65" height="8"/>
      <rect x="106.9" y="123" width="10.65" height="8"/><rect x="119.05" y="123" width="10.65" height="8"/>
      <rect x="131.2" y="123" width="10.65" height="8"/><rect x="143.35" y="123" width="10.65" height="8"/>
    </g>
    <g fill="#fff8e6" opacity=".25">
      <rect x="34" y="123" width="10.65" height="1.5"/><rect x="46.15" y="123" width="10.65" height="1.5"/>
      <rect x="58.3" y="123" width="10.65" height="1.5"/><rect x="70.45" y="123" width="10.65" height="1.5"/>
      <rect x="82.6" y="123" width="10.65" height="1.5"/><rect x="94.75" y="123" width="10.65" height="1.5"/>
      <rect x="106.9" y="123" width="10.65" height="1.5"/><rect x="119.05" y="123" width="10.65" height="1.5"/>
      <rect x="131.2" y="123" width="10.65" height="1.5"/><rect x="143.35" y="123" width="10.65" height="1.5"/>
    </g>

    <!-- CHARGE row: bolt icon + percent + blue bar -->
    <path d="M18 143 L24 150 L20.5 150 L23 157 L16 149 L19.5 149 Z" fill="#9ab5d6"/>
    <text x="154" y="156" text-anchor="end" class="pct" fill="#bcd8f4">72%</text>
    <rect x="34" y="160" width="120" height="10" fill="#080905" stroke="#7b582b" stroke-opacity=".95"/>
    <g clip-path="url(#chargeFill4)">
      <g fill="url(#chargeGrad)">
        <rect x="34" y="161" width="10.65" height="8"/><rect x="46.15" y="161" width="10.65" height="8"/>
        <rect x="58.3" y="161" width="10.65" height="8"/><rect x="70.45" y="161" width="10.65" height="8"/>
        <rect x="82.6" y="161" width="10.65" height="8"/><rect x="94.75" y="161" width="10.65" height="8"/>
        <rect x="106.9" y="161" width="10.65" height="8"/><rect x="119.05" y="161" width="10.65" height="8"/>
        <rect x="131.2" y="161" width="10.65" height="8"/><rect x="143.35" y="161" width="10.65" height="8"/>
      </g>
      <g fill="#eef6ff" opacity=".25">
        <rect x="34" y="161" width="10.65" height="1.5"/><rect x="46.15" y="161" width="10.65" height="1.5"/>
        <rect x="58.3" y="161" width="10.65" height="1.5"/><rect x="70.45" y="161" width="10.65" height="1.5"/>
        <rect x="82.6" y="161" width="10.65" height="1.5"/><rect x="94.75" y="161" width="10.65" height="1.5"/>
        <rect x="106.9" y="161" width="10.65" height="1.5"/><rect x="119.05" y="161" width="10.65" height="1.5"/>
        <rect x="131.2" y="161" width="10.65" height="1.5"/><rect x="143.35" y="161" width="10.65" height="1.5"/>
      </g>
    </g>
    <rect x="34" y="160" width="86.4" height="10" fill="none" stroke="#cfe6ff" stroke-opacity=".22"/>

    <path d="M70 179 H102" stroke="#7b582b" stroke-width="1"/>
    <path d="M86 176.5 L89 179 L86 181.5 L83 179 Z" fill="#d9ae66" opacity=".85"/>
  </g>

  <!-- ============================== RETICLE ============================== -->
  <g transform="translate(640 360)">
    <g stroke="#0b0905" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".7">
      <path d="M-5 -22 L0 -17 L5 -22" fill="none"/>
      <path d="M-5 22 L0 17 L5 22" fill="none"/>
      <path d="M-22 -5 L-17 0 L-22 5" fill="none"/>
      <path d="M22 -5 L17 0 L22 5" fill="none"/>
    </g>
    <g stroke="#f4dfad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
      <path d="M-5 -22 L0 -17 L5 -22" fill="none"/>
      <path d="M-5 22 L0 17 L5 22" fill="none"/>
      <path d="M-22 -5 L-17 0 L-22 5" fill="none"/>
      <path d="M22 -5 L17 0 L22 5" fill="none"/>
    </g>
    <circle r="13" fill="none" stroke="#fff6df" stroke-opacity=".28" stroke-width="1"/>
    <circle r="4.2" fill="none" stroke="#e7b45a" stroke-opacity=".9" stroke-width="1.2"/>
    <circle r="1.7" fill="#e7b45a" filter="url(#softGlow)"/>
  </g>
</svg>
</body>
</html>
