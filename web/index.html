<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>craftiero</title>
<meta name="description" content="craftiero: a 3D worm shooter with fully destructible terrain, running in your browser.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
  /* overscroll-behavior stops pull-to-refresh from firing during a look drag. */
  html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; overscroll-behavior: none; }
  /* winit sizes its drawing buffer from this box (times devicePixelRatio).
     touch-action: none hands every finger to the game: no scroll, no pinch zoom. */
  #game {
    display: block; width: 100vw; height: 100vh; outline: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #msg {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 6px; padding: 16px; text-align: center; color: #cfd6e4;
    font: 16px/1.5 system-ui, sans-serif; pointer-events: none;
    background: radial-gradient(ellipse at center, #1c2230 0%, #0b0d12 70%);
  }
  #msg.hidden { display: none; }
  #logo { width: min(34vw, 150px); height: auto; filter: drop-shadow(0 6px 0 #0006); }
  /* The wordmark is live text in the HUD's colours: warm orange with a dark ink
     outline (paint-order keeps the outline outside the letters). */
  #name {
    margin: 0; font: 900 clamp(40px, 9vw, 76px)/1 "Arial Black", Impact, system-ui, sans-serif;
    letter-spacing: .04em; text-transform: uppercase; color: #ffb347;
    -webkit-text-stroke: 8px #1b120a; paint-order: stroke fill;
    text-shadow: 0 5px 0 #6b2f0c;
  }
  #status { max-width: 34em; margin-top: 12px; color: #9fa9bd; font-size: 15px; }
  /* The touch layout is built for two thumbs in landscape. A page cannot force
     the orientation (the lock API needs fullscreen and iOS has none), so on a
     portrait phone this covers the game and asks for a turn. */
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; text-align: center;
    background: #0b0d12; color: #cfd6e4; font: 18px/1.5 system-ui, sans-serif;
  }
  #rotate svg { width: 72px; height: 72px; animation: turn 2.4s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 70%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  /* Touch devices only; shown while the page is not fullscreen. */
  #fs {
    display: none; position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right));
    z-index: 5; width: 44px; height: 44px; padding: 0; border-radius: 10px; cursor: pointer;
    border: 2px solid #1b120a; background: #ffb347cc; touch-action: manipulation;
  }
  #fs svg { width: 24px; height: 24px; }
  @media (pointer: coarse) { #fs.can { display: block; } }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 12px; text-align: center; color: #cfd6e4aa;
    font: 13px/1.4 system-ui, sans-serif; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="msg">
  <img id="logo" src="logo.svg" alt="">
  <h1 id="name">craftiero</h1>
  <div id="status">Loading...</div>
</div>
<div id="rotate">
  <svg viewBox="0 0 24 24" fill="none" stroke="#ffb347" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
    <rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2" stroke-linecap="round"/>
  </svg>
  <div>Turn your phone sideways to play</div>
</div>
<button id="fs" aria-label="Fullscreen">
  <svg viewBox="0 0 24 24" fill="none" stroke="#1b120a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
  </svg>
</button>
<div id="hint">Click to play &middot; WASD move &middot; mouse aim &middot; LMB fire &middot; RMB rope &middot; Shift dig &middot; Space jump &middot; Esc release mouse &middot; M mute</div>
<script type="module">
  const msg = document.getElementById("msg");
  const status = document.getElementById("status");
  const say = (text) => { status.textContent = text; msg.classList.remove("hidden"); };

  // On a phone the keyboard hint is useless: say what the thumbs do instead, and
  // hide it after the first touch (the controls are drawn by the game itself).
  const hint = document.getElementById("hint");
  if (matchMedia("(pointer: coarse)").matches) {
    hint.textContent = "Left thumb: move · right thumb: look · hold FIRE or DIG and drag to aim at the same time · tap the weapon to switch";
    addEventListener("touchstart", () => hint.remove(), { once: true, passive: true });
  }

  // Fullscreen: a button, plus an automatic switch on the first tap. The browser
  // only allows it inside a user gesture, and touchend counts (touchstart does
  // not). iPhone Safari has no element fullscreen, so there the button stays hidden.
  const fs = document.getElementById("fs");
  const root = document.documentElement;
  const enterFullscreen = () => (root.requestFullscreen || root.webkitRequestFullscreen)?.call(root)?.catch?.(() => {});
  if (matchMedia("(pointer: coarse)").matches && (root.requestFullscreen || root.webkitRequestFullscreen)) {
    const sync = () => fs.classList.toggle("can", !(document.fullscreenElement || document.webkitFullscreenElement));
    sync();
    document.addEventListener("fullscreenchange", sync);
    document.addEventListener("webkitfullscreenchange", sync);
    fs.addEventListener("click", enterFullscreen);
    addEventListener("touchend", () => { if (fs.classList.contains("can")) enterFullscreen(); }, { once: true, passive: true });
  }

  // The renderer ray-marches a 3D texture and reads storage buffers in fragment
  // shaders, which WebGL2 cannot do, so WebGPU is a hard requirement.
  if (!navigator.gpu) {
    say("This game needs WebGPU: use a current Chrome, Edge, Firefox (141+) or Safari (26+).");
  } else {
    try {
      const wasm = await import("./pkg/viewer.js");
      say("Starting (building the arena and compiling shaders, this takes a moment)...");
      // Let the browser paint the line above before the module's start function
      // blocks the tab for the map build.
      await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));
      await wasm.default();
      // The canvas starts drawing a frame or so later; hide the message then.
      setTimeout(() => msg.classList.add("hidden"), 500);
    } catch (e) {
      // winit "throws" a harmless control-flow exception to leave its loop.
      if (!String(e).includes("Using exceptions for control flow")) {
        say("Could not start: " + e);
        console.error(e);
      } else {
        setTimeout(() => msg.classList.add("hidden"), 500);
      }
    }
  }
</script>
</body>
</html>
