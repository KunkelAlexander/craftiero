# Fly.io config for the relay and server-hosted matches (the paid-but-cheap alternative to Render's free
# tier: about $2 a month, no cold start if one machine stays running).
# Deploy from the repo root:  fly launch --no-deploy --copy-config   then
#                             fly deploy --ha=false
#
# ONE machine only: rooms live in the server's memory, so a second machine would
# be a second, separate set of rooms, and a friend could land on the wrong one.
# (`--ha=false` stops Fly from creating a standby copy.)
app = "craftiero-relay"     # app names are global: change it if taken
primary_region = "sin"      # Singapore; pick the region closest to your players

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true          # browsers on https pages may only open wss://
  auto_stop_machines = "off"  # "stop" is cheaper but brings a cold start back
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  # The relay alone needs little, but every match the server hosts holds its own
  # copy of the terrain (tens of MB): give it room.
  memory = "512mb"
